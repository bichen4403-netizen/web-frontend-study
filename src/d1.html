<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>难点 1 · 插入时的比较路径</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="d1">
<nav id="nav"></nav>
<main class="page">
  <header class="page-head">
    <span class="kind" id="kind"></span>
    <h1 id="title"></h1>
    <p class="question" id="question"></p>
  </header>
  <div class="layout">
    <div class="main">
      <section class="card stage">
        <svg id="tree" class="tree"></svg>
        <div class="player">
          <button id="btn-prev" onclick="prev()">← 上一步</button>
          <button id="btn-play" class="primary" onclick="if (timer) pause(); else play();">播放</button>
          <button id="btn-next" onclick="next()">下一步 →</button>
          <button onclick="reset()">重置</button>
          <select onchange="setSpeed(Number(this.value))">
            <option value="1200">慢 ×1</option>
            <option value="800" selected>中 ×2</option>
            <option value="350">快 ×4</option>
          </select>
          <span id="progress" class="progress"></span>
        </div>
        <p class="hint">键盘：空格 播放 / 暂停，← → 单步</p>
      </section>
      <section class="card rules">
        <h2>插入规则</h2>
        <ol class="code" id="code"></ol>
      </section>
    </div>
    <aside class="side">
      <div class="card">
        <h2>插入一个值</h2>
        <div class="row">
          <input id="value" type="number">
          <button onclick="randomValue()">随机一个值</button>
        </div>
        <button class="primary wide" onclick="startInsert()">开始插入</button>
        <h2 class="sub">初始树</h2>
        <div class="row">
          <button onclick="setTree(data.presetTree)">默认树</button>
          <button onclick="randomTree()">随机生成</button>
        </div>
      </div>
      <div class="card status">
        <h2>当前步骤</h2>
        <p id="note"></p>
      </div>
      <div class="card">
        <h2>比较记录</h2>
        <ol id="log" class="log"></ol>
      </div>
    </aside>
  </div>
</main>
<script src="js/common.js"></script>
<script src="js/d1.js"></script>
</body>
</html>
